<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Run | Start</title>
    <link rel="stylesheet" href="styles.css?v=runner17" />
    <link rel="stylesheet" href="start.css?v=runner17" />
  </head>
  <body>
    <main class="game" id="game">
      <div class="city" aria-hidden="true"></div>
      <div class="grid-floor" aria-hidden="true"></div>
      <div class="scanline" aria-hidden="true"></div>

      <header class="topbar start-topbar">
        <div class="step-badge">1</div>
        <div>
          <p class="eyebrow">Start Screen</p>
          <h1>Cyber Run</h1>
        </div>
      </header>

      <section class="screen screen-start active" id="startScreen">
        <div class="logo-lockup">
          <span>Cyber</span>
          <span>Run</span>
        </div>
        <div class="cast-row">
          <div class="hero-kid large" aria-label="Cyber Run player character">
            <div class="hair"></div>
            <div class="face"></div>
            <div class="hoodie"></div>
            <div class="legs"></div>
          </div>
          <div class="bot large" aria-label="ByteBot helper">
            <div class="antenna"></div>
            <div class="bot-head"><span></span><span></span></div>
            <div class="bot-body"></div>
          </div>
        </div>
        <div class="speech right">Tap start to begin your cyber mission.</div>
        <a class="primary start-button" href="tutorial.html">Start Game</a>
        <p class="caption">Player begins the mission</p>
      </section>
    </main>
    <script src="game-state.js?v=runner17"></script>
    <script src="start.js?v=runner17"></script>
  </body>
</html>
