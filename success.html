<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Run | Mission Success</title>
    <link rel="stylesheet" href="styles.css?v=runner17" />
    <link rel="stylesheet" href="success.css?v=runner17" />
  </head>
  <body>
    <main class="game">
      <div class="city" aria-hidden="true"></div>
      <div class="grid-floor" aria-hidden="true"></div>
      <div class="scanline" aria-hidden="true"></div>
      <header class="topbar">
        <div class="step-badge">7</div>
        <div><p class="eyebrow">Mission Complete</p><h1>Rewards</h1></div>
        <div class="hud">
          <div class="hud-card"><span>Score</span><strong id="score">0</strong></div>
          <div class="hud-card"><span>Timer</span><strong id="timer">0:00</strong></div>
          <div class="hud-card"><span>Lives</span><strong id="lives">3/3</strong></div>
        </div>
        <div class="game-controls"><button id="pauseButton" type="button">Pause</button><button id="restartButton" type="button">Restart</button></div>
      </header>
      <section class="screen screen-complete active" id="completeScreen">
        <div class="confetti" aria-hidden="true"></div>
        <h2 id="missionResultTitle">Mission Success!</h2>
        <p id="missionResultText">You protected Cyber City from phishing attacks.</p>
        <div class="final-score">
          <span id="rewardStatus">Score Reward</span>
          <span>Final Score</span>
          <strong id="finalScore">120</strong>
          <small>Reward Earned:</small>
          <b id="rewardBadge">Phishing Detector Champion</b>
          <p id="rewardMessage">Mission success bonus unlocked.</p>
        </div>
        <div class="complete-cast">
          <div class="bot large" aria-label="ByteBot helper">
            <div class="antenna"></div><div class="bot-head"><span></span><span></span></div><div class="bot-body"></div>
          </div>
          <div class="hero-kid large celebrate" aria-label="Player celebrating">
            <div class="hair"></div><div class="face"></div><div class="hoodie"></div><div class="legs"></div>
          </div>
        </div>
        <div class="complete-actions">
          <button class="primary" id="playAgainButton" type="button">Play Again</button>
          <button class="secondary" id="exitButton" type="button">Exit</button>
        </div>
        <p class="caption">Mission success and rewards</p>
      </section>
    </main>
    <script src="game-state.js?v=runner17"></script>
    <script src="success.js?v=runner17"></script>
  </body>
</html>
