<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Run | Run</title>
    <link rel="stylesheet" href="styles.css?v=runner17" />
    <link rel="stylesheet" href="run.css?v=runner17" />
  </head>
  <body>
    <main class="game">
      <div class="city" aria-hidden="true"></div>
      <div class="grid-floor" aria-hidden="true"></div>
      <div class="scanline" aria-hidden="true"></div>
      <header class="topbar">
        <div class="step-badge">3</div>
        <div><p class="eyebrow">Challenge Appears</p><h1>Cyber Threat</h1></div>
        <div class="hud">
          <div class="hud-card"><span>Score</span><strong id="score">0</strong></div>
          <div class="hud-card"><span>Timer</span><strong id="timer">0:10</strong></div>
          <div class="hud-card"><span>Lives</span><strong id="lives">3/3</strong></div>
        </div>
        <div class="game-controls">
          <button id="pauseButton" type="button">Pause</button>
          <button id="restartButton" type="button">Restart</button>
        </div>
      </header>
      <section class="screen screen-challenge active runner-live" id="challengeScreen" tabindex="-1">
        <div class="runner-row" id="runnerRow">
          <div class="runner-ground" aria-hidden="true"></div>
          <div class="hero-kid running" id="runnerPlayer" aria-label="Player running">
            <div class="hair"></div><div class="face"></div><div class="hoodie"></div><div class="legs"></div>
          </div>
          <article class="email-card" id="emailCard">
            <div class="email-meta">
              <div class="mail-icon">!</div>
              <div><p id="emailFrom"></p><p id="emailSubject"></p></div>
            </div>
            <h2 id="emailHeadline"></h2>
            <button type="button">Verify Account</button>
          </article>
          <div class="runner-pickup" id="runnerPickup" aria-label="Health point pickup">+5</div>
          <div class="run-prompt" id="runPrompt">Space = jump. Collect green points. Avoid the red threat.</div>
        </div>
        <div class="bot clue-bot" aria-label="ByteBot helper">
          <div class="antenna"></div><div class="bot-head"><span></span><span></span></div><div class="bot-body"></div>
        </div>
        <div class="speech clue" id="bytebotClue">Is this message real or a scam?</div>
        <p class="caption">A cyber threat appears</p>
      </section>
    </main>
    <script src="game-state.js?v=runner17"></script>
    <script src="run.js?v=runner17"></script>
  </body>
</html>
