<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Run | Question</title>
    <link rel="stylesheet" href="styles.css?v=runner17" />
    <link rel="stylesheet" href="question.css?v=runner17" />
  </head>
  <body>
    <main class="game">
      <div class="city" aria-hidden="true"></div>
      <div class="grid-floor" aria-hidden="true"></div>
      <div class="scanline" aria-hidden="true"></div>
      <header class="topbar">
        <div class="step-badge">4</div>
        <div><p class="eyebrow">Decision Screen</p><h1>Choose Wisely</h1></div>
        <div class="hud">
          <div class="hud-card"><span>Score</span><strong id="score">0</strong></div>
          <div class="hud-card"><span>Timer</span><strong id="timer">0:00</strong></div>
          <div class="hud-card"><span>Lives</span><strong id="lives">3/3</strong></div>
        </div>
        <div class="game-controls"><button id="pauseButton" type="button">Pause</button><button id="restartButton" type="button">Restart</button></div>
      </header>
      <section class="screen screen-decision active" id="decisionScreen">
        <div class="question-panel">
          <p class="question-kicker">Cyber Question</p>
          <h2 id="decisionQuestion">What will you do?</h2>
          <p id="decisionScenario">Read the message and choose the safest response.</p>
        </div>
        <div class="decision-grid" id="decisionGrid"></div>
        <div class="answer-rules">
          <p><span class="good-dot">OK</span> Correct answer: +10 points</p>
          <p><span class="bad-dot">X</span> Wrong answer: lose 1 life</p>
        </div>
        <p class="caption">Choose wisely</p>
      </section>
    </main>
    <script src="game-state.js?v=runner17"></script>
    <script src="question.js?v=runner17"></script>
  </body>
</html>
